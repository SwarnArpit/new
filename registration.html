<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div>
        <h1>Login Window</h1>
        <form>
            <label for="username">Username:</label>
            <input type="text"
                    id="username"
                    name="username">
                    <br><br>


            
            <label for="password">Password:</label>  
            
            <input type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="12"
            title="Password must contain 8-12 characters">
                <br><br>
                <button type="submit">Login</button>
                <br><br>



        </form>
        <a href="resume.html">View about me</a>
        
    </div>
</body>
</html>
