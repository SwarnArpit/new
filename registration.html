<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: beige;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        /* Main Resume */
        .resume {
            width: 700px;
            background-color: #f5f5dc;
            padding: 30px;
            border-radius: 15px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 17px;
        }

        /* Flexbox Cards */
        .cards {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Individual Card */
        .card {
            width: 90%;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #c8b88a;
            box-shadow: 0px 5px 12px rgba(0,0,0,0.15);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #5c4b2a;
        }

        .card p {
            text-align: center;
            line-height: 1.6;
            margin: 7px;
        }

        /* Education Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #e8dfc5;
        }

        /* Skills */
        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: #eee5c8;
            justify-content: center;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #b8a878;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
        }

    </style>
    
    <div>
        
        <h1 class="header h1">Login Window</h1>
        <br><br>
        <div class="cards">
            <div class="card">
                <h2>Login Form</h2>
                <p>Please enter your username and password to login.</p>
        <form >
            <label for="username">Username:</label>
            <input type="text"
                    id="username"
                    name="username">
                    <br><br>


            
            <label for="password">Password:</label>  
            
            <input type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="12"
            title="Password must contain 8-12 characters">
                <br><br>
                <button type="submit">Login</button>
                <br><br>
                </div>

                </div>
                

        </form>
        <br><br>
        <div class="skill">
        <a id="skills" href="resume.html">View about me</a>
        
    </div>
</body>
</html>
